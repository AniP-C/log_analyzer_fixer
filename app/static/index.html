<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowFix Agent</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: rgba(255, 251, 244, 0.88);
      --ink: #1f2933;
      --muted: #52606d;
      --accent: #b45309;
      --accent-2: #1d4ed8;
      --border: rgba(31, 41, 51, 0.12);
      --shadow: 0 20px 50px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(180, 83, 9, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(29, 78, 216, 0.2), transparent 28%),
        linear-gradient(135deg, #efe7da 0%, #f6f1e8 45%, #e9edf5 100%);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .shell {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .hero {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 0.95;
    }

    .subtitle {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 1rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 0;
    }

    .pane {
      padding: 24px 28px 28px;
    }

    .pane + .pane {
      border-left: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      min-height: 180px;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 16px;
      font: inherit;
      font-size: 1rem;
      resize: vertical;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: white;
      font: inherit;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 10px 20px rgba(180, 83, 9, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .status {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    pre {
      margin: 0;
      padding: 18px;
      min-height: 280px;
      border-radius: 18px;
      background: #101828;
      color: #d1d5db;
      overflow: auto;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .kv {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 12px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.7);
      margin-top: 14px;
    }

    .k {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .v {
      font-weight: 600;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(31, 41, 51, 0.12);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, var(--accent-2), #22c55e);
      transition: width 200ms ease;
    }

    .sample {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .sample button {
      margin: 10px 8px 0 0;
      padding: 8px 12px;
      background: white;
      color: var(--ink);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    @media (max-width: 780px) {
      .content {
        grid-template-columns: 1fr;
      }

      .pane + .pane {
        border-left: 0;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="eyebrow">FlowFix Agent</span>
      <h1>Detect. Decide. Act.</h1>
      <p class="subtitle">Paste an order-processing incident, run the agent, and inspect the structured remediation response.</p>
    </section>
    <section class="content">
      <section class="pane">
        <label for="input">Incident Input</label>
        <textarea id="input" placeholder="Order 123 stuck in processing"></textarea>
        <button id="analyzeBtn">Analyze Incident</button>
        <div class="status" id="status"></div>
        <div class="kv" id="summary" style="display:none;">
          <div class="k">Issue type</div><div class="v" id="sumIssueType">—</div>
          <div class="k">Root cause</div><div class="v" id="sumRootCause">—</div>
          <div class="k">Decision</div><div class="v" id="sumDecision">—</div>
          <div class="k">Notification</div><div class="v" id="sumNotification">—</div>
          <div class="k">Confidence</div>
          <div>
            <div class="bar"><div id="confBar"></div></div>
            <div class="k" id="confText" style="margin-top:6px;">—</div>
          </div>
        </div>
        <div class="sample">
          Scenario buttons:
          <div>
            <button type="button" data-sample="Many orders stuck in CREATED status">Orders stuck in CREATED</button>
            <button type="button" data-sample="Workflow failed due to timeout contacting downstream dependency for order 456">Workflow failure</button>
            <button type="button" data-sample="File batch 77 failed: PayPal order missing billing address">Faulty order in file</button>
            <button type="button" data-sample="Batch export delayed on previous run; next run has spike because two batches combined">Batch delay issue</button>
          </div>
          <div style="margin-top:12px;">
            Quick samples:
            <div>
              <button type="button" data-sample="Order 123 stuck in processing">Workflow stuck</button>
              <button type="button" data-sample="File failed due to invalid character in billing address for order 789">Invalid chars</button>
              <button type="button" data-sample="Workflow execution failed for order 456">File failure</button>
            </div>
          </div>
        </div>
      </section>
      <section class="pane">
        <pre id="output">{
  "status": "ready"
}</pre>
      </section>
    </section>
  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const summary = document.getElementById("summary");
    const sumIssueType = document.getElementById("sumIssueType");
    const sumRootCause = document.getElementById("sumRootCause");
    const sumDecision = document.getElementById("sumDecision");
    const sumNotification = document.getElementById("sumNotification");
    const confBar = document.getElementById("confBar");
    const confText = document.getElementById("confText");

    document.querySelectorAll("[data-sample]").forEach((button) => {
      button.addEventListener("click", () => {
        input.value = button.getAttribute("data-sample");
      });
    });

    function renderSummary(data) {
      if (!data || typeof data !== "object") {
        summary.style.display = "none";
        return;
      }
      summary.style.display = "grid";
      sumIssueType.textContent = data.issue_type ?? "—";
      sumRootCause.textContent = data.root_cause ?? "—";
      sumDecision.textContent = data.decision ?? "—";
      sumNotification.textContent = data.notification ?? "—";
      const conf = Number(data.confidence ?? 0);
      const pct = Math.max(0, Math.min(100, Math.round(conf * 100)));
      confBar.style.width = pct + "%";
      confText.textContent = `${pct}% (${conf.toFixed(2)})`;
    }

    analyzeBtn.addEventListener("click", async () => {
      const value = input.value.trim();
      if (!value) {
        status.textContent = "Add an incident before running the agent.";
        return;
      }

      status.textContent = "Analyzing incident...";
      output.textContent = "{\n  \"status\": \"running\"\n}";
      summary.style.display = "none";

      try {
        const response = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: value })
        });

        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
        renderSummary(data);
        status.textContent = response.ok ? "Analysis complete." : "Request failed.";
      } catch (error) {
        status.textContent = "Agent request failed.";
        output.textContent = JSON.stringify({ error: String(error) }, null, 2);
        summary.style.display = "none";
      }
    });
  </script>
</body>
</html>
